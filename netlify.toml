# Auto-deploy: Netlify builds from GitHub. This is the SELF-PACED CST site: production branch = cst-async. A push to `cst-async-staging` gets its own preview URL.
# No build step — the page is a single static file. Nothing secret lives here; the service-role key stays in Supabase.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Defense-in-depth against XSS and data exfiltration if an escaping bug ever slips in.
    # 'unsafe-inline' is needed because the page's own JS/CSS is inline (no build step) — this still blocks
    # loading any *external* script, blocks framing, and blocks forms/fetches from going anywhere but Supabase.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://mddvqxesxfifqxhuzhsi.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"

# Always revalidate the page so a deploy reaches students immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Only the site files are served; repo tooling and backend source never are.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
